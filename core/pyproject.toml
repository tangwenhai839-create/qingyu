[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qingyu-core"
version = "0.1.0"
description = "Qingyu Core identity, continuity, governance and audit foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.27,<1",
  "cryptography>=45,<51",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# bare `pytest` (unlike `python -m pytest`) does not put core/ on sys.path, so
# `from app...` / `from tests...` imports in conftest.py failed at collection
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

