name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      # Blocking: syntax errors and undefined names only. Wider style rules are tracked in an issue.
      - run: ruff check --select E9,F63,F7,F82 .

  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: clients/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ../../contracts -e ".[dev]"
      - run: pytest -q

  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qingyu
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: qingyu_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://qingyu:ci-only-password@localhost:5432/qingyu_test
      TEST_DATABASE_URL: postgresql+psycopg://qingyu:ci-only-password@localhost:5432/qingyu_test
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Alembic history has a single head
        run: python -c "from alembic.script import ScriptDirectory; heads = ScriptDirectory('alembic').get_heads(); assert len(heads) == 1, heads"
      # Backup tests invoke pg_dump/pg_restore and require client version 16,
      # matching the postgres:16 service. ubuntu-latest does not ship that
      # client; install it from the PostgreSQL Apt repository, which follows
      # the runner's Ubuntu codename (resolute-pgdg on 26.04, and later suites).
      - name: Install PostgreSQL 16 client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl
          if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-common \
            && [ -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          else
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
            arch="$(dpkg --print-architecture)"
            sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${codename}-pgdg
          Architectures: ${arch}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
            sudo apt-get update
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client-16
          pg_dump --version | grep -q 'PostgreSQL) 16\.'
      - run: alembic upgrade head
      - run: pytest -q

  core-portable:
    # Runs the Core test files that work on a plain Linux runner.
    # Other Core suites need Docker-managed PostgreSQL roles, Windows APIs or
    # owner-private configuration; see ci/core-portable-tests.txt and the README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./core[dev]"
      - name: Portable Core tests (one file at a time)
        working-directory: core
        run: |
          set -e
          for f in $(sed 's#^core/##' ../ci/core-portable-tests.txt); do
            echo "::group::$f"
            timeout 300 pytest -q -p no:cacheprovider "$f"
            echo "::endgroup::"
          done
