name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      # Blocking: syntax errors and undefined names only. Wider style rules are tracked in an issue.
      - run: ruff check --select E9,F63,F7,F82 .

  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qingyu
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: qingyu_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://qingyu:ci-only-password@localhost:5432/qingyu_test
      TEST_DATABASE_URL: postgresql+psycopg://qingyu:ci-only-password@localhost:5432/qingyu_test
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -q

  core-portable:
    # Runs the Core test files that work on a plain Linux runner.
    # Other Core suites need Docker-managed PostgreSQL roles, Windows APIs or
    # owner-private configuration; see ci/core-portable-tests.txt and the README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./core[dev]"
      - name: Portable Core tests (one file at a time)
        working-directory: core
        run: |
          set -e
          for f in $(sed 's#^core/##' ../ci/core-portable-tests.txt); do
            echo "::group::$f"
            timeout 300 pytest -q -p no:cacheprovider "$f"
            echo "::endgroup::"
          done
