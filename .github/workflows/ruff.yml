name: Ruff
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Pinned to the version that cleaned gateway/. Wider Core and contracts
      # findings stay on the syntax-only check until issue #8.
      - run: pip install "ruff==0.17.2"
      - run: ruff check gateway
